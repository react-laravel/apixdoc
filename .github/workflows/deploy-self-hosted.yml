name: Build and deploy ApiXDoc to B

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and test without uploading or activating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-apixdoc-b
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build placeholders only; B keeps the actual runtime configuration.
      DATABASE_URL: postgresql://build:build@127.0.0.1:9/apixdoc?schema=public
      AUTH_SECRET: build-only-placeholder-never-a-runtime-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Install the unchanged npm lock on the hosted runner
        run: npm ci
      - name: Generate Prisma client without connecting to a database
        run: ./node_modules/.bin/prisma generate
      - name: Check deployment boundaries and application
        run: |
          python3 -m unittest discover -s tests/deployment -p 'test_*.py'
          node --test tests/deployment/ledger.contract.cjs
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build
      - name: Package the standalone runtime and migration metadata
        run: |
          node scripts/prepare-apixdoc-runtime.mjs
          python3 scripts/package-apixdoc.py "$RUNNER_TEMP/apixdoc-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
      - name: Upload, validate and publish the single ApiXDoc scope
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.validate_only == false)
        env:
          B_APIXDOC_DEPLOY_SSH_KEY: ${{ secrets.B_APIXDOC_DEPLOY_SSH_KEY }}
          B_APIXDOC_DEPLOY_KNOWN_HOSTS: ${{ secrets.B_APIXDOC_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-apixdoc-to-b.sh "$RUNNER_TEMP/apixdoc-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
      - name: Remove the transient runtime archive
        if: always()
        run: rm -f "$RUNNER_TEMP/apixdoc-$GITHUB_SHA.tar.gz"
